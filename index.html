<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手槍成就：硬核生存修行系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(220, 38, 38, 0.6); }
        }
        @keyframes glitched {
            0% { clip-path: inset(20% 0 50% 0); transform: translate(-5px); }
            20% { clip-path: inset(80% 0 10% 0); transform: translate(5px); }
            40% { clip-path: inset(40% 0 40% 0); transform: translate(-5px); }
            60% { clip-path: inset(10% 0 80% 0); transform: translate(5px); }
            100% { clip-path: inset(20% 0 50% 0); transform: translate(-5px); }
        }
        .shoot-btn {
            animation: pulse-red 2s infinite;
        }
        .achievement-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .locked {
            filter: grayscale(1) opacity(0.3);
        }
        .unlocked {
            filter: grayscale(0) opacity(1);
            border-color: rgba(168, 85, 247, 0.6) !important;
            background: rgba(88, 28, 135, 0.3) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }
        #toast {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .damage-shake {
            animation: shake 0.2s ease-in-out 3;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .survival-hud {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.95) 100%);
            backdrop-filter: blur(10px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-100 min-h-screen overflow-x-hidden selection:bg-red-500/30 font-sans">

    <!-- Toast 通知 -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] opacity-0 pointer-events-none">
        <div class="bg-gradient-to-r from-yellow-500 to-orange-600 text-black px-8 py-4 rounded-2xl font-black shadow-2xl flex items-center gap-3 border-2 border-white/20">
            <i class="fas fa-trophy text-2xl"></i>
            <div>
                <div class="text-[10px] uppercase tracking-tighter opacity-70">Achievement Unlocked</div>
                <div id="toast-text" class="text-lg">解鎖成就！</div>
            </div>
        </div>
    </div>

    <!-- 社會性死亡覆蓋層 -->
    <div id="death-overlay" class="fixed inset-0 bg-red-950/98 z-[90] hidden flex flex-col items-center justify-center text-center p-4 backdrop-blur-xl">
        <div class="relative">
            <i class="fas fa-skull text-9xl text-white mb-8 animate-pulse"></i>
            <div class="absolute inset-0 text-red-500 text-9xl opacity-20 blur-sm animate-ping"><i class="fas fa-skull"></i></div>
        </div>
        <h2 class="text-6xl md:text-8xl font-black text-white mb-4 italic tracking-tighter">BUSTED!</h2>
        <p class="text-red-200 text-xl font-bold mb-12 max-w-md uppercase tracking-widest">家人正在房門外盤問... <br><span class="text-white">修行次數損失: -10</span></p>
        <div class="px-8 py-4 bg-white/10 rounded-full font-mono text-2xl border border-white/20" id="respawn-timer">尷尬冷卻中 (5s)</div>
    </div>

    <!-- 家人突襲事件 -->
    <div id="event-overlay" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-4 border-red-600 p-10 rounded-[3rem] max-w-sm w-full text-center shadow-[0_0_80px_rgba(220,38,38,0.6)]">
            <div class="text-6xl text-red-600 mb-6">
                <i class="fas fa-eye animate-bounce"></i>
            </div>
            <h3 class="text-3xl font-black text-white mb-2">！！！被發現預警！！！</h3>
            <p class="text-slate-400 mb-8 font-bold">家人正在門口徘徊，快反應！</p>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="triggerEvent('fake')" class="bg-blue-600 py-5 rounded-2xl font-black text-xl hover:bg-blue-500 transition-all active:scale-95 shadow-lg shadow-blue-900/40 uppercase">偽裝模式</button>
                <button onclick="triggerEvent('hide')" class="bg-slate-700 py-5 rounded-2xl font-black text-xl hover:bg-slate-600 transition-all active:scale-95 uppercase">迅速躲藏</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <div class="inline-block px-4 py-1 rounded-full border border-red-500/50 text-red-500 text-[10px] font-black tracking-[0.4em] uppercase mb-4 animate-pulse">Hardcore Survival Mode</div>
            <h1 class="text-6xl md:text-9xl font-black mb-4 bg-gradient-to-b from-white via-slate-400 to-slate-900 bg-clip-text text-transparent italic tracking-tighter">
                THE VOID
            </h1>
            
            <div class="text-8xl md:text-[12rem] font-mono font-black text-white my-10 tracking-tighter cursor-crosshair hover:text-red-500 transition-colors duration-500" id="main-counter" onclick="handleSecretClick()">0</div>
            
            <div class="flex flex-col items-center gap-8">
                <div class="relative group">
                    <button id="main-btn" onclick="handleShoot()" class="shoot-btn relative px-24 py-12 bg-white text-black hover:bg-slate-200 rounded-[3rem] font-black text-4xl transition-all active:scale-90 disabled:opacity-20 disabled:grayscale">
                        修行
                    </button>
                    <div id="stamina-warning" class="absolute -top-10 left-1/2 -translate-x-1/2 text-red-500 font-black text-xs hidden animate-bounce">體力耗盡！</div>
                </div>

                <!-- 生存 HUD 面板 -->
                <div class="survival-hud border border-slate-800 p-8 rounded-[3rem] w-full max-w-4xl shadow-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                        <!-- HP -->
                        <div class="space-y-2">
                            <div class="flex justify-between text-[10px] font-black tracking-widest text-slate-500">
                                <span><i class="fas fa-heart text-red-500"></i> HEALTH (尊嚴值)</span>
                                <span id="hp-text">100 / 100</span>
                            </div>
                            <div class="h-3 bg-slate-950 rounded-full border border-slate-800 p-[2px]">
                                <div id="hp-bar" class="h-full bg-red-600 rounded-full transition-all duration-300 w-full shadow-[0_0_10px_rgba(220,38,38,0.5)]"></div>
                            </div>
                        </div>
                        <!-- Stamina -->
                        <div class="space-y-2">
                            <div class="flex justify-between text-[10px] font-black tracking-widest text-slate-500">
                                <span><i class="fas fa-bolt text-yellow-500"></i> STAMINA (體力)</span>
                                <span id="stamina-text">100 / 100</span>
                            </div>
                            <div class="h-3 bg-slate-950 rounded-full border border-slate-800 p-[2px]">
                                <div id="stamina-bar" class="h-full bg-yellow-500 rounded-full transition-all duration-300 w-full shadow-[0_0_10px_rgba(234,179,8,0.5)]"></div>
                            </div>
                        </div>
                        <!-- Suspicion -->
                        <div class="space-y-2">
                            <div class="flex justify-between text-[10px] font-black tracking-widest text-slate-500">
                                <span><i class="fas fa-eye text-blue-500"></i> SUSPICION (懸念)</span>
                                <span id="suspicion-text">0%</span>
                            </div>
                            <div class="h-3 bg-slate-950 rounded-full border border-slate-800 p-[2px]">
                                <div id="suspicion-bar" class="h-full bg-blue-500 rounded-full transition-all duration-300 w-0"></div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <label class="flex flex-col items-center justify-center gap-2 bg-slate-800/40 border border-slate-700 p-4 rounded-2xl cursor-pointer hover:bg-slate-700 transition-all">
                            <input type="checkbox" id="stealth-mode" class="hidden peer">
                            <div class="w-full text-center py-1 text-[10px] font-black uppercase peer-checked:text-blue-400">躲藏模式</div>
                            <div class="text-2xl peer-checked:text-blue-500 text-slate-600"><i class="fas fa-user-secret"></i></div>
                        </label>
                        <label class="flex flex-col items-center justify-center gap-2 bg-slate-800/40 border border-slate-700 p-4 rounded-2xl cursor-pointer hover:bg-slate-700 transition-all">
                            <input type="checkbox" id="tissue-mode" class="hidden peer">
                            <div class="w-full text-center py-1 text-[10px] font-black uppercase peer-checked:text-green-400">半張衛生紙</div>
                            <div class="text-2xl peer-checked:text-green-500 text-slate-600"><i class="fas fa-leaf"></i></div>
                        </label>
                        <button onclick="startMeditation()" class="flex flex-col items-center justify-center gap-2 bg-slate-800/40 border border-slate-700 p-4 rounded-2xl hover:bg-slate-700 transition-all">
                            <div class="text-[10px] font-black uppercase">冥想模式</div>
                            <div class="text-2xl text-purple-500"><i class="fas fa-brain"></i></div>
                        </button>
                        <button onclick="changeLocation()" id="location-btn" class="flex flex-col items-center justify-center gap-2 bg-slate-800/40 border border-slate-700 p-4 rounded-2xl hover:bg-slate-700 transition-all">
                            <div class="text-[10px] font-black uppercase">當前地點</div>
                            <div class="text-2xl text-slate-400" id="location-icon"><i class="fas fa-bed"></i></div>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div class="bg-slate-900/50 border border-slate-800 p-6 rounded-[2rem]">
                    <h2 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">修行階段進度</h2>
                    <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden mb-3">
                        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-full w-0 transition-all duration-1000"></div>
                    </div>
                    <div class="flex justify-between text-[10px] font-black text-slate-600">
                        <span id="progress-text">0% COMPLETE</span>
                        <span id="unlocked-count">0 / 24</span>
                    </div>
                </div>

                <div id="volume-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- 數量成就 -->
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-slate-900/50 border border-slate-800 p-8 rounded-[3rem] shadow-2xl">
                    <h2 class="text-xl font-black italic mb-8 flex items-center gap-3">
                        <i class="fas fa-medal text-yellow-500"></i> SPECIAL MISSIONS
                    </h2>
                    <div id="special-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 特殊成就 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 核心狀態
        let count = 0;
        let health = 100;
        let stamina = 100;
        let suspicion = 0;
        let unlockedIds = new Set();
        let currentLocation = 'bedroom'; // 使用 currentLocation 避免與 window.location 衝突
        let isDead = false;
        let meditationActive = false;
        let startTime = Date.now();
        let lastShootTime = 0;
        let combo = 0;

        const volumeAchievements = [
            { id: 'v1', name: '小屌上路', req: 1, icon: 'fa-bullseye' },
            { id: 'v2', name: '飢餓右手', req: 15, icon: 'fa-hand-rock' },
            { id: 'v3', name: '熟能生巧', req: 30, icon: 'fa-fire' },
            { id: 'v4', name: '菁英之才', req: 300, icon: 'fa-medal' },
            { id: 'v5', name: '傳說之路', req: 900, icon: 'fa-star' },
            { id: 'v6', name: '無盡的狂暴', req: 3500, icon: 'fa-dragon' },
            { id: 'v7', name: '無窮的飢餓', req: 9000, icon: 'fa-ghost' },
            { id: 'v8', name: '狂亂的魔法師', req: 18000, icon: 'fa-hat-wizard' },
            { id: 'v9', name: '神之境界', req: 90000, icon: 'fa-crown' },
            { id: 'v10', name: '神的統帥者', req: 690000, icon: 'fa-khanda' },
            { id: 'v11', name: '虚無', req: 870000, icon: 'fa-circle' },
        ];

        const specialAchievements = [
            { id: 's1', name: '偽裝', desc: '在被家人發現時，成功騙取家人。', icon: 'fa-user-mask' },
            { id: 's2', name: '隱蔽', desc: '家人在時，成功打出3發不被發現。', icon: 'fa-eye-slash' },
            { id: 's3', name: '敏迅', desc: '成功在30秒內打完一發。', icon: 'fa-bolt' },
            { id: 's4', name: '耐力', desc: '成功在90分鐘後打完一發。', icon: 'fa-hourglass' },
            { id: 's5', name: '節能', desc: '使用半張衛生紙。', icon: 'fa-leaf' },
            { id: 's6', name: '特勇', desc: '在家人面前尻至5發以上。', icon: 'fa-shield-heart' },
            { id: 's9', name: '金手指', desc: '無影視/想像下，點擊主計數器射精。', icon: 'fa-hand-sparkles' },
            { id: 's12', name: '完美遮蔽', desc: '在公共場合成功打出6發以上。', icon: 'fa-mask' },
            { id: 's13', name: '冥想的空獨者', desc: '想像情況下不使用手而射精。', icon: 'fa-brain' }
        ];

        function init() {
            const vList = document.getElementById('volume-list');
            volumeAchievements.forEach(ach => {
                vList.innerHTML += `
                    <div id="${ach.id}" class="achievement-card locked flex items-center justify-between p-4 rounded-2xl border border-slate-800 bg-slate-900/40">
                        <div class="flex items-center gap-3">
                            <i class="fas ${ach.icon} w-5 text-slate-400"></i>
                            <span class="font-bold text-xs uppercase">${ach.name}</span>
                        </div>
                        <span class="text-[10px] font-mono opacity-50">${ach.req.toLocaleString()}</span>
                    </div>
                `;
            });

            const sGrid = document.getElementById('special-grid');
            specialAchievements.forEach(ach => {
                sGrid.innerHTML += `
                    <div id="${ach.id}" class="achievement-card locked flex flex-col p-5 rounded-[2rem] border border-slate-800 bg-slate-900/40">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400">
                                <i class="fas ${ach.icon}"></i>
                            </div>
                            <span class="font-black uppercase tracking-tighter text-sm">${ach.name}</span>
                        </div>
                        <p class="text-[10px] text-slate-500 font-bold leading-relaxed">${ach.desc}</p>
                    </div>
                `;
            });

            // 修行核心循環
            setInterval(() => {
                if (isDead) return;

                // 體力恢復與消耗
                const hiding = document.getElementById('stealth-mode').checked;
                if (hiding) {
                    stamina = Math.min(100, stamina + 4);
                    suspicion = Math.max(0, suspicion - 3);
                } else {
                    stamina = Math.min(100, stamina + 0.5);
                    suspicion = Math.max(0, suspicion - 0.2);
                }

                // 隨機突襲檢查 (懸念越高機率越高)
                if (!hiding && suspicion > 30 && Math.random() < (suspicion / 1000)) {
                    showEvent();
                }

                updateHUD();
            }, 200);

            // 抑制成就 (s7/s8 簡化判斷)
            setTimeout(() => { if (count === 0) showToastNotification("修行抑制者！"); }, 15000);
            
            updateProgress();
        }

        function handleShoot() {
            if (isDead) return;
            if (stamina < 15) {
                const warn = document.getElementById('stamina-warning');
                warn.classList.remove('hidden');
                setTimeout(() => warn.classList.add('hidden'), 1000);
                return;
            }

            const now = Date.now();
            count++;
            stamina -= 15;
            
            // 懸念增加
            let suspInc = 10;
            if (currentLocation === 'public') suspInc = 25;
            if (document.getElementById('stealth-mode').checked) suspInc = 2;
            suspicion = Math.min(100, suspicion + suspInc);

            document.getElementById('main-counter').innerText = count.toLocaleString();

            // 成就判定
            volumeAchievements.forEach(ach => { if (count >= ach.req) unlock(ach.id); });
            if (now - startTime < 30000) unlock('s3');
            if (document.getElementById('tissue-mode').checked) unlock('s5');
            if (currentLocation === 'public' && count >= 6) unlock('s12');

            // 特勇判定 (高懸念連射)
            if (suspicion > 80) combo++; else combo = 0;
            if (combo >= 5) unlock('s6');

            updateHUD();
            updateProgress();
        }

        function handleSecretClick() {
            if (isDead) return;
            unlock('s9');
            handleShoot();
        }

        function updateHUD() {
            // HP
            document.getElementById('hp-bar').style.width = health + '%';
            document.getElementById('hp-text').innerText = `${Math.round(health)} / 100`;
            // Stamina
            document.getElementById('stamina-bar').style.width = stamina + '%';
            document.getElementById('stamina-text').innerText = `${Math.round(stamina)} / 100`;
            // Suspicion
            document.getElementById('suspicion-bar').style.width = suspicion + '%';
            document.getElementById('suspicion-text').innerText = `${Math.round(suspicion)}%`;

            const sBar = document.getElementById('suspicion-bar');
            if (suspicion > 70) sBar.classList.replace('bg-blue-500', 'bg-red-500');
            else sBar.classList.replace('bg-red-500', 'bg-blue-500');
        }

        function takeDamage(amount) {
            health = Math.max(0, health - amount);
            document.body.classList.add('damage-shake');
            setTimeout(() => document.body.classList.remove('damage-shake'), 500);
            if (health <= 0) triggerDeath();
            updateHUD();
        }

        function triggerDeath() {
            isDead = true;
            count = Math.max(0, count - 10); // 懲罰：次數減少
            document.getElementById('main-counter').innerText = count.toLocaleString();
            document.getElementById('death-overlay').classList.remove('hidden');
            let time = 5;
            const timer = setInterval(() => {
                time--;
                document.getElementById('respawn-timer').innerText = `尷尬冷卻中 (${time}s)`;
                if (time <= 0) {
                    clearInterval(timer);
                    isDead = false;
                    health = 50;
                    suspicion = 0;
                    document.getElementById('death-overlay').classList.add('hidden');
                    updateHUD();
                }
            }, 1000);
        }

        function showEvent() {
            document.getElementById('event-overlay').classList.remove('hidden');
            this.eventTimer = setTimeout(() => {
                closeEvent();
                takeDamage(40);
            }, 3000);
        }

        function triggerEvent(type) {
            clearTimeout(this.eventTimer);
            if (type === 'fake') unlock('s1');
            if (type === 'hide') unlock('s2');
            closeEvent();
        }

        function closeEvent() {
            document.getElementById('event-overlay').classList.add('hidden');
        }

        function startMeditation() {
            if (meditationActive || isDead) return;
            meditationActive = true;
            const btn = document.getElementById('main-btn');
            btn.disabled = true;
            let p = 0;
            const timer = setInterval(() => {
                p += 5;
                btn.innerText = `冥想中 ${p}%`;
                if (p >= 100) {
                    clearInterval(timer);
                    unlock('s13');
                    meditationActive = false;
                    btn.disabled = false;
                    btn.innerText = "修行";
                    handleShoot();
                }
            }, 150);
        }

        function changeLocation() {
            currentLocation = (currentLocation === 'bedroom' ? 'public' : 'bedroom');
            const icon = document.getElementById('location-icon');
            icon.innerHTML = currentLocation === 'bedroom' ? '<i class="fas fa-bed"></i>' : '<i class="fas fa-users"></i>';
            icon.classList.toggle('text-red-500', currentLocation === 'public');
        }

        function unlock(id) {
            if (unlockedIds.has(id)) return;
            unlockedIds.add(id);
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('locked');
                el.classList.add('unlocked');
                showToastNotification(el.querySelector('.font-black, .font-bold').innerText);
            }
            updateProgress();
        }

        function updateProgress() {
            const total = volumeAchievements.length + specialAchievements.length;
            const percent = Math.round((unlockedIds.size / total) * 100);
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = `${percent}% COMPLETE`;
            document.getElementById('unlocked-count').innerText = `${unlockedIds.size} / ${total}`;
        }

        function showToastNotification(name) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = `成就解鎖：${name}`;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 20px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0px)';
            }, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
